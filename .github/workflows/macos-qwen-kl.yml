name: macos-qwen-kl-debugger

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  run-experiments:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Hugging Face assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/hf
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sweeps (toy + qwen)
        run: |
          python scripts/run_all.py --debug-llm --qwen-topk 10 --fixed-budget 256 --topk-sweep 4,8,16,32

      - name: Validate KL numeric integrity
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          fp = Path('results/results_raw.csv')
          if not fp.exists():
              raise SystemExit('missing results/results_raw.csv')

          df = pd.read_csv(fp)
          qwen = df[df['family'] == 'qwen_mlx']
          if qwen.empty:
              raise SystemExit('qwen rows missing in results_raw.csv')

          if qwen['kl_divergence'].isna().any():
              bad = qwen[qwen['kl_divergence'].isna()][['interface', 'budget']]
              raise SystemExit(f'NaN KL detected in qwen rows:\n{bad}')
          PY

      - name: Upload result artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwen2-mlx-kl-debugger-artifacts
          path: |
            results/results_raw.csv
            results/results_summary.csv
            results/*.png
            results/debug/*.jsonl
            results/debug/*.csv
          if-no-files-found: error
