name: macos-qwen-kl-debugger

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  run-experiments:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run toy + qwen experiments with debug artifacts
        run: |
          python experiments/run_experiments.py --output-dir results --debug-llm --run-toy --run-qwen

      - name: Upload result artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwen-kl-debugger-artifacts
          path: |
            results/results_raw.csv
            results/results_summary.csv
            results/*.jsonl
            results/*.csv
            results/*.png
          if-no-files-found: error
